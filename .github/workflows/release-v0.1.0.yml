name: Publish v0.1.0 release

# Bootstrap the first release on creation of this workflow. Later releases
# can use the standard version-tag publishing workflow.
on:
  push:
    branches: [master]
    paths: ['.github/workflows/release-v0.1.0.yml']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Test, publish image, create Git tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [ "$version" != "0.1.0" ]; then
            echo "This bootstrap workflow only releases v0.1.0; found $version" >&2
            exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Check tag does not already exist
        id: tag_check
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag $RELEASE_TAG already exists; no changes will be made."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run tests
        if: steps.tag_check.outputs.exists == 'false'
        run: npm test

      - name: Enable ARM64 emulation
        if: steps.tag_check.outputs.exists == 'false'
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        if: steps.tag_check.outputs.exists == 'false'
        uses: docker/setup-buildx-action@v4

      - name: Authenticate to GHCR
        if: steps.tag_check.outputs.exists == 'false'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish v0.1.0 (amd64 + arm64)
        if: steps.tag_check.outputs.exists == 'false'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/belphegorprime/forgehands:${{ steps.version.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=forgehands
          cache-to: type=gha,scope=forgehands,mode=max

      - name: Create and push annotated Git tag
        if: steps.tag_check.outputs.exists == 'false'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" "$GITHUB_SHA" -m "ForgeHands $RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"
